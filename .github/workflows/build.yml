name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: bash gradlew --no-daemon clean test build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: qte-engine-jars
          path: build/libs/*.jar
